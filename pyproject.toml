[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notebook2md"
version = "0.1.0"
authors = [
  { name = "Tiago Silva" }
]
description = "Convert Jupyter Notebooks to Markdown with cell delimiters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pyperclip",
  "python-dotenv>=1.2.3",
  "nbformat",
  "nbconvert>=7.17.1",
  "pygments>=2.21.0",
  "tornado>=6.5.7"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.scripts]
notebook2md = "notebook2md.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/notebook2md"]

[tool.ruff]
line-length = 100
extend-exclude = ["sample.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "bleach!=6.3.0",
  "mistralai!=2.4.6",
  "guardrails-ai!=0.10.1",
  "mistune>=3.3.0",
  "soupsieve>=2.8.4",
]

[dependency-groups]
dev = [
  "pip-audit>=2.9.0",
  "pytest>=9.1.1",
  "ruff>=0.16.4",
]
